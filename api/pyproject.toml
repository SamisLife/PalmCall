[project]
name = "handsfree"
version = "0.1.0"
description = "Wearable gesture -> real phone call. Callwright integration layer."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[tool.uv]
# Virtual project: deps get installed, code runs from the repo root.
# No build step, no editable install, nothing to explain at 9pm.
package = false
